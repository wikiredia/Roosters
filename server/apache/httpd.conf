# Apache voor Roosters: statische app + reverse proxy naar de API.
# TLS staat aan met `-D TLS` (zie entrypoint.sh, TLS_MODE in .env).

ServerRoot "/usr/local/apache2"
ServerName ${PUBLIC_HOST}
PidFile /tmp/apache/httpd.pid
Listen 8080
<IfDefine TLS>
  Listen 8443
</IfDefine>

LoadModule mpm_event_module modules/mod_mpm_event.so
LoadModule authz_core_module modules/mod_authz_core.so
LoadModule mime_module modules/mod_mime.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule headers_module modules/mod_headers.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule unixd_module modules/mod_unixd.so
LoadModule dir_module modules/mod_dir.so
LoadModule alias_module modules/mod_alias.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so
LoadModule filter_module modules/mod_filter.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule reqtimeout_module modules/mod_reqtimeout.so
<IfDefine TLS>
  LoadModule ssl_module modules/mod_ssl.so
  LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
</IfDefine>

# ---- Algemene hardening -------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
Timeout 30
KeepAliveTimeout 5
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
LimitRequestBody 3145728
LimitRequestFields 50
LimitRequestLine 4096
MaxRequestWorkers 150

ErrorLog /proc/self/fd/2
LogLevel warn
# Geheime agenda-links (/api/feed/...) komen nooit in de logs
SetEnvIf Request_URI "^/api/feed/" nolog
LogFormat "%a %t \"%m %U\" %>s %b %Dus" short
CustomLog /proc/self/fd/1 short env=!nolog

TypesConfig conf/mime.types
AddType application/manifest+json .webmanifest
AddType font/woff2 .woff2
AddDefaultCharset utf-8
AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml

DocumentRoot "/usr/local/apache2/htdocs"
DirectoryIndex index.html

<Directory />
  AllowOverride None
  Require all denied
</Directory>
<Directory "/usr/local/apache2/htdocs">
  Options -Indexes -FollowSymLinks -Includes -ExecCGI
  AllowOverride None
  Require all granted
</Directory>
<FilesMatch "^\.">
  Require all denied
</FilesMatch>

# Let's Encrypt-controle (enkel via poort 80)
Alias /.well-known/acme-challenge/ /acme/.well-known/acme-challenge/
<Directory "/acme/.well-known/acme-challenge">
  Options -Indexes -FollowSymLinks
  AllowOverride None
  ForceType text/plain
  Require all granted
</Directory>

# ---- Beveiligingsheaders ------------------------------------------------------
Header always set X-Content-Type-Options "nosniff"
Header always set Referrer-Policy "no-referrer"
Header always set X-Frame-Options "DENY"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()"
Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'"
Header always unset X-Powered-By

# Statische bestanden: altijd hervalideren (klein, en zo komt een update meteen binnen)
<LocationMatch "^/(?!api/)">
  Header set Cache-Control "no-cache"
</LocationMatch>
<LocationMatch "^/(fonts|icons)/">
  Header set Cache-Control "public, max-age=2592000, immutable"
</LocationMatch>

# ---- API ---------------------------------------------------------------------
ProxyRequests Off
ProxyPreserveHost On
ProxyTimeout 60
# Het echte IP van de bezoeker; wat de bezoeker zelf meestuurt wordt overschreven
RequestHeader set X-Real-IP "expr=%{REMOTE_ADDR}"
RequestHeader set X-Forwarded-Proto "https" env=HTTPS
RequestHeader unset X-Forwarded-For

<IfDefine !TLS>
  <VirtualHost *:8080>
    ProxyPass        /api/ http://api:8000/api/ retry=0
    ProxyPassReverse /api/ http://api:8000/api/
  </VirtualHost>
</IfDefine>

<IfDefine TLS>
  SSLRandomSeed startup builtin
  SSLSessionCache "shmcb:/tmp/apache/ssl_scache(512000)"
  SSLProtocol -all +TLSv1.2 +TLSv1.3
  SSLHonorCipherOrder off
  SSLCipherSuite ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
  SSLSessionTickets off

  # Poort 80: enkel de certificaatcontrole, de rest gaat naar https
  <VirtualHost *:8080>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${PUBLIC_HOST}%{REQUEST_URI} [R=301,L]
  </VirtualHost>

  <VirtualHost *:8443>
    SSLEngine on
    SSLCertificateFile /tmp/apache/cert.pem
    SSLCertificateKeyFile /tmp/apache/key.pem
    Header always set Strict-Transport-Security "max-age=31536000"
    ProxyPass        /api/ http://api:8000/api/ retry=0
    ProxyPassReverse /api/ http://api:8000/api/
  </VirtualHost>
</IfDefine>
