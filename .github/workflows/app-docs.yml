name: Roosters+ docs service

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/app-docs.yml"]
  pull_request:
    paths: ["app/**", ".github/workflows/app-docs.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/docs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/docs/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Tests
        run: pytest -q
      # Every doc heading must name a file/symbol that exists (renamed code without its doc fails here)
      - name: Docs match the code
        run: python check_content.py
      - name: Docker image builds
        run: docker build -t roostersplus-docs .
