name: Desktop-app bouwen

# Bouwt de menubalk-app (Mac, .dmg) en de systeemvak-app (Windows, installer).
# Op main komen ze in de release 'desktop-latest' met vaste namen, zodat de knop in
# Opties → Op je computer altijd de nieuwste geeft. Niet ondertekend: zie desktop/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
            args: --target universal-apple-darwin
            bundle: desktop/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            name: windows
            args: ""
            bundle: desktop/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Testen
        working-directory: desktop/src-tauri
        run: cargo test
      - run: npm ci
      - name: Bouwen
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: roosters-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    # Enkel op main (niet bij een PR): de downloadknop op de site wijst naar deze release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Vaste bestandsnamen
        run: |
          cp dist/roosters-mac/*.dmg Roosters-mac.dmg
          cp dist/roosters-windows/*.exe Roosters-windows.exe
      - name: Release 'desktop-latest' bijwerken
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          notes="Nieuwste build van de menubalk-/systeemvak-app (commit ${GITHUB_SHA::7}). Op je Roosters-server: Opties → Op je computer."
          if gh release view desktop-latest >/dev/null 2>&1; then
            gh release edit desktop-latest --notes "$notes"
          else
            gh release create desktop-latest --target "$GITHUB_SHA" --title "Desktop-app" --notes "$notes"
          fi
          gh release upload desktop-latest Roosters-mac.dmg Roosters-windows.exe --clobber
