<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Systeemstates</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2449E0}a:hover{color:#161F2A}
.tt .blk{left:44px;right:0}
.days{display:flex;gap:4px}
.day{flex:1;min-height:52px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;line-height:16px;font-weight:700;color:var(--color-ink-2)}
.day b{font-size:17px;line-height:22px;color:var(--color-ink)}
.day.on{background:var(--color-ink);color:var(--color-ink-inverse)}
.day.on b{color:var(--color-ink-inverse)}
.pad{padding:0 20px}
</style>
</helmet>
<div class="rp board" style="width: 2285px; height: 2200px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<section class="band {{t.cls}}">
  <h2 class="band-head">Systeemstates <span>{{t.label}} · nooit een volledig scherm met spinner</span></h2>
  <div class="shots">

    <!-- S1 Offline + queued -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>A</b> Offline · actie in de wachtrij</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <header class="topbar" style="align-items: flex-end"><div class="stack"><p class="eyebrow">Bijgewerkt 11:02</p><h1 class="title">Vandaag</h1></div><button class="statusbtn" aria-label="Jouw status: Op school. Tik om te wisselen naar Thuis"><span class="dot"></span>Op school<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3.5 7.5 7 11M3.5 7.5h13M17 13l3.5 3.5L17 20M20.5 16.5h-13"></path></svg></button></header>
        <div class="pad" style="padding-bottom: 12px"><div class="banner banner-ink" role="status"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M8.5 16a5 5 0 0 1 7 0M5 12.5a10 10 0 0 1 5-2.6M14.5 10a10 10 0 0 1 4.5 2.5M2 9a15 15 0 0 1 4.6-2.8M11 5.6A15 15 0 0 1 22 9"></path></svg><span>Geen verbinding. Je ziet je laatst gekende rooster.</span></div></div>
        <div class="content" style="gap: 24px">
          <div class="nowcard"><div class="hstack g3"><span class="now-pill">Nu</span><p class="title-sheet">Pauze tot 13:30</p></div><div class="hstack g3"><p class="t-sm grow">Volgende: Cloud Computing 13:30 · C102</p><button class="btn btn-sm" style="border: 1.5px solid rgba(255,255,255,0.7); color: #FFFFFF; padding: 0 10px; font-size: 13px" aria-label="Cloud Computing overslaan">Vak overslaan</button></div></div>
          <section class="sec">
            <div class="sec-head"><h2>Open verzoeken</h2></div>
            <div class="card">
              <div class="row">
                <span class="av av-sm c-kayra">K</span>
                <span class="row-main"><span class="t-base b">Pauze gevraagd aan Kayra</span><span class="row-sub hstack g1"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg>Wordt verstuurd zodra je weer online bent</span></span>
              </div>
            </div>
          </section>
          <section class="sec">
            <div class="sec-head"><h2>Samen pauze vandaag</h2><span class="aside">2</span></div>
            <div class="togcard">
              <div class="row"><span class="av c-kayra">K</span><span class="row-main"><span class="row-title">Kayra</span><span class="row-sub">11:20 – 12:30</span></span></div>
              <div class="row"><span class="av-stack"><span class="av c-lotte">L</span><span class="av c-amir">A</span></span><span class="row-main"><span class="row-title">Lotte en Amir</span><span class="row-sub">12:30 – 13:30</span></span></div>
            </div>
          </section>
        </div>
      </div>
    </figure>

    <!-- S2 School wifi login -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>B</b> Schoolwifi-loginpagina gevonden</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <header class="topbar" style="align-items: flex-end"><div class="stack"><p class="eyebrow">Bijgewerkt 08:12</p><h1 class="title">Vandaag</h1></div><button class="statusbtn" aria-label="Jouw status: Op school. Tik om te wisselen naar Thuis"><span class="dot"></span>Op school<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3.5 7.5 7 11M3.5 7.5h13M17 13l3.5 3.5L17 20M20.5 16.5h-13"></path></svg></button></header>
        <div class="content" style="gap: 24px">
          <div class="card card-pad" style="border: 2px solid var(--color-ink); gap: 14px">
            <div class="hstack g3" style="align-items: flex-start">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"></path><circle cx="12" cy="19.5" r=".9" fill="currentColor"></circle></svg>
              <div class="stack g1 grow"><p class="t-lg b">Log eerst in op de schoolwifi</p><p class="t-sm m2">Je zit op het wifi-netwerk van AP, maar je bent nog niet ingelogd. Daarna werkt alles weer.</p></div>
            </div>
            <button class="btn btn-primary">Open wifi-login</button>
          </div>
          <div class="nowcard"><div class="hstack g3"><span class="now-pill">Nu</span><p class="title-sheet">Pauze tot 13:30</p></div><div class="hstack g3"><p class="t-sm grow">Volgende: Cloud Computing 13:30 · C102</p><button class="btn btn-sm" style="border: 1.5px solid rgba(255,255,255,0.7); color: #FFFFFF; padding: 0 10px; font-size: 13px" aria-label="Cloud Computing overslaan">Vak overslaan</button></div></div>
          <section class="sec">
            <div class="sec-head"><h2>Samen pauze vandaag</h2><span class="aside">laatst gekend</span></div>
            <div class="togcard"><div class="row"><span class="av-stack"><span class="av c-lotte">L</span><span class="av c-amir">A</span></span><span class="row-main"><span class="row-title">Lotte en Amir</span><span class="row-sub">12:30 – 13:30</span></span></div></div>
          </section>
        </div>
      </div>
    </figure>

    <!-- S3 Network blocks -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>C</b> Netwerk blokkeert de app</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <header class="topbar"><h1 class="title">Chat</h1></header>
        <div class="pad" style="padding-bottom: 16px">
          <div class="card card-pad" style="background: var(--color-danger-soft); border-color: transparent; gap: 10px">
            <div class="hstack g3" style="align-items: flex-start"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="bad-ink"><circle cx="12" cy="12" r="8.5"></circle><path d="M6 6l12 12"></path></svg><div class="stack g1 grow"><p class="b">Dit netwerk blokkeert Roosters+.</p><p class="t-sm">Probeer 4G of een ander netwerk. Je rooster blijft zichtbaar.</p></div></div>
            <a class="link t-sm" href="#" style="padding-left: 34px">Waarom gebeurt dit?</a>
          </div>
        </div>
        <div class="content" style="padding: 0 16px">
          <div class="card">
            <div class="row"><span class="av av-md c-kayra">K</span><span class="row-main"><span class="row-title">Kayra</span><span class="row-sub">B-blok, aan de automaat</span></span><span class="t-xs m3">11:16</span></div>
            <div class="row"><span class="av av-md c-lotte">L</span><span class="row-main"><span class="row-title">Lotte</span><span class="row-sub bad-ink b">Jij: niet verstuurd</span></span><span class="t-xs m3">11:21</span></div>
            <div class="row"><span class="av av-md c-yeno">Y</span><span class="row-main"><span class="row-title">Yeno</span><span class="row-sub">Morgen samen de tram?</span></span><span class="t-xs m3">gisteren</span></div>
          </div>
        </div>
      </div>
    </figure>

    <!-- S4 Untis down -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>D</b> Untis plat · laatst gekend rooster</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <header class="topbar"><h1 class="title">Rooster</h1></header>
        <div class="pad" style="display: flex; flex-direction: column; gap: 12px; padding-bottom: 10px">
          <div class="banner banner-bad" role="status"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="bad-ink"><path d="M12 4 21 19.5H3z"></path><path d="M12 10v4.5M12 17.2v.3"></path></svg><span class="grow">Untis is even niet bereikbaar. Bijgewerkt gisteren 18:04.</span></div>
          <div class="days"><button class="day">Ma<b>19</b></button><button class="day on" aria-current="date">Di<b>20</b></button><button class="day">Wo<b>21</b></button><button class="day">Do<b>22</b></button><button class="day">Vr<b>23</b></button></div>
        </div>
        <div style="flex: 1; padding: 8px 20px 0; overflow: hidden">
          <div class="tt" style="height: 528px">
            <div class="tt-hour" style="top: 0"><span>08:00</span></div><div class="tt-hour" style="top: 48px"><span>09:00</span></div><div class="tt-hour" style="top: 96px"><span>10:00</span></div><div class="tt-hour" style="top: 144px"><span>11:00</span></div><div class="tt-hour" style="top: 192px"><span>12:00</span></div><div class="tt-hour" style="top: 240px"><span>13:00</span></div><div class="tt-hour" style="top: 288px"><span>14:00</span></div><div class="tt-hour" style="top: 336px"><span>15:00</span></div><div class="tt-hour" style="top: 384px"><span>16:00</span></div><div class="tt-hour" style="top: 432px"><span>17:00</span></div>
            <div class="blk blk-lab blk-past" style="top: 25px; height: 93px; left: 46px"><span class="blk-t">Python Advanced</span><span class="t-xs">Labo · A.1.05</span></div>
            <div class="blk blk-theory" style="top: 121px; height: 93px; left: 46px"><span class="hstack between"><span class="blk-t">Databases</span><span class="tag tag-n">Stand gisteren</span></span><span class="t-xs">Theorie · B204</span></div>
            <div class="blk blk-theory" style="top: 265px; height: 93px; left: 46px"><span class="blk-t">Cloud Computing</span><span class="t-xs">Theorie · C102</span></div>
            <div class="blk blk-lab" style="top: 373px; height: 93px; left: 46px"><span class="blk-t">Web Frameworks</span><span class="t-xs">Labo · B204</span></div>
            <div class="now-line" style="top: 160px; left: 46px"><span class="now-chip" style="left: -46px">11:20</span></div>
          </div>
          <div class="legend" style="padding-top: 10px"><span class="lg"><i class="lg-theory"></i>Theorie</span><span class="lg"><i class="lg-lab"></i>Labo</span><span class="lg"><i class="lg-cancel"></i>Vervalt</span><span class="lg"><i class="lg-tog"></i>Samen</span></div>
        </div>
      </div>
    </figure>

    <!-- S5 First load skeleton -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>E</b> Allereerste keer laden · enkel hier skeletons</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <header class="topbar" style="align-items: flex-end"><div class="stack"><p class="eyebrow">Dinsdag 20 oktober</p><h1 class="title">Vandaag</h1></div><button class="statusbtn" aria-label="Jouw status: Op school. Tik om te wisselen naar Thuis"><span class="dot"></span>Op school<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4 3.5 7.5 7 11M3.5 7.5h13M17 13l3.5 3.5L17 20M20.5 16.5h-13"></path></svg></button></header>
        <div class="content" style="gap: 24px" aria-busy="true">
          <p class="t-sm m2" role="status">Je rooster ophalen bij AP Hogeschool…</p>
          <div class="skel" style="height: 150px; border-radius: 12px"></div>
          <div class="stack g3">
            <div class="skel" style="height: 14px; width: 45%"></div>
            <div class="card" style="padding: 12px 16px; gap: 14px">
              <div class="hstack g3"><div class="skel" style="width: 64px; height: 56px; border-radius: 8px"></div><div class="stack g2 grow"><div class="skel" style="height: 14px; width: 70%"></div><div class="skel" style="height: 12px; width: 40%"></div></div></div>
              <div class="hstack g3"><div class="skel" style="width: 64px; height: 56px; border-radius: 8px"></div><div class="stack g2 grow"><div class="skel" style="height: 14px; width: 60%"></div><div class="skel" style="height: 12px; width: 35%"></div></div></div>
            </div>
          </div>
          <div class="stack g3">
            <div class="skel" style="height: 14px; width: 35%"></div>
            <div class="card" style="padding: 12px 16px; gap: 14px">
              <div class="hstack g3"><div class="skel" style="width: 40px; height: 40px; border-radius: 20px"></div><div class="stack g2 grow"><div class="skel" style="height: 14px; width: 50%"></div><div class="skel" style="height: 12px; width: 65%"></div></div></div>
              <div class="hstack g3"><div class="skel" style="width: 40px; height: 40px; border-radius: 20px"></div><div class="stack g2 grow"><div class="skel" style="height: 14px; width: 45%"></div><div class="skel" style="height: 12px; width: 55%"></div></div></div>
            </div>
          </div>
        </div>
      </div>
    </figure>

  </div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2285,"height":2200}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [
      { id: 'l', cls: 'theme-light', label: 'Licht' },
      { id: 'd', cls: 'theme-dark', label: 'Donker' }
    ] };
  }
}
</script>
</body>
</html>
