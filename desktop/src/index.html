<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roosters</title>
<style>
  :root { --paper: #F2F4F7; --ink: #16202B; --muted: #667286; --line: #D8DDE5; --card: #FFFFFF; --accent: #2E5BFF; --danger: #E5484D; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #121821; --ink: #E9EEF4; --muted: #93A0B2; --line: #2A3442; --card: #1A222D; --accent: #6E8CFF; --danger: #FF6B6F; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font: 16px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex; flex-direction: column; justify-content: center; padding: 24px; -webkit-user-select: none; user-select: none; }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -.01em; }
  p { color: var(--muted); margin: 0 0 18px; }
  label { display: block; font-size: 14px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  input { width: 100%; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); color: var(--ink); -webkit-user-select: text; user-select: text; }
  button { width: 100%; margin-top: 12px; font: inherit; font-weight: 650; padding: 12px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: default; }
  button:disabled { opacity: .5; }
  .err { color: var(--danger); font-size: 14px; min-height: 20px; margin: 10px 0 0; }
  .hint { font-size: 13px; margin-top: 18px; }
</style>
</head>
<body>
  <h1>Roosters</h1>
  <p>Op welk adres staat je Roosters-server? Hetzelfde als op je gsm.</p>
  <form id="f">
    <label for="url">Serveradres</label>
    <input id="url" placeholder="https://…" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
    <button id="go" type="submit">Verbinden</button>
    <p class="err" id="err" role="alert"></p>
  </form>
  <p class="hint">Daarna koppel je dit toestel zoals je beginscherm-app: op je gsm <b>Opties → Koppel je beginscherm-app</b>, en hier het juiste getal aantikken (zelfde wifi).</p>
<script>
  const { invoke } = window.__TAURI__.core;
  const input = document.getElementById("url");
  const err = document.getElementById("err");
  const btn = document.getElementById("go");
  invoke("get_server").then((s) => { if (s) input.value = s; });
  document.getElementById("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    try {
      await invoke("set_server", { url: input.value });
    } catch (x) {
      err.textContent = String(x);
      btn.disabled = false;
    }
  });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") invoke("hide_popover"); });
</script>
</body>
</html>
