name: Roosters+ API (v2)

on:
  push:
    branches: [main]
    paths: ["app/api/**", ".github/workflows/app-api.yml"]
  pull_request:
    paths: ["app/api/**", ".github/workflows/app-api.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: roosters_test
          MYSQL_USER: roosters
          MYSQL_PASSWORD: roosters
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=30
      redis:
        image: valkey/valkey:8.1-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: app/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/api/requirements*.txt
      - name: Install
        run: pip install -r requirements-dev.txt ruff==0.17.1
      - name: Lint
        run: ruff check roosters tests
      - name: Tests (real MySQL + Valkey)
        run: pytest -q
      - name: Docker image builds
        run: docker build -t roostersplus-api .
