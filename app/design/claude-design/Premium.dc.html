<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<title>Premium</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./tokens.css">
<link rel="stylesheet" href="./ui.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:ital,wght@0,400;0,700;0,800;1,400&amp;family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;display=swap">
<style>
body{margin:0}
a{color:#2449E0}a:hover{color:#161F2A}
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--gradient-premium);color:#161F2A;padding:20px;display:flex;align-items:flex-end;gap:12px;min-height:150px}
.feat{display:flex;gap:14px;align-items:center;padding:10px 0}
.feat + .feat{border-top:1px solid var(--color-line)}
.fi{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#161F2A}
.plan{display:flex;flex-direction:row;gap:14px;align-items:flex-start;padding:16px;width:100%;border-radius:14px;background:var(--color-surface);border:1.5px solid var(--color-line-strong);text-align:left}
.plan.on{border:2.5px solid var(--color-premium);background:var(--color-premium-soft)}
.plan .radio.on{border-color:var(--color-premium)}
.plan .radio.on::after{background:var(--color-premium)}
.loss{display:flex;gap:12px;align-items:center;padding:10px 0}
.loss + .loss{border-top:1px solid var(--color-line)}
</style>
</helmet>
<div class="rp board" style="width: 1403px; height: 3000px">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<section class="band {{t.cls}}">
  <h2 class="band-head">Premium <span>{{t.label}} · €2,99/maand of €19,99/jaar · glans mag, druk zetten niet</span></h2>
  <div class="shots">

    <!-- P1 Paywall -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>A</b> Paywall in context: 4e vriend vergelijken · volledige scroll</figcaption>
      <div class="phone" style="height: 1220px">
        <div class="safe"></div>
        <div class="navbar"><button class="btn-icon filled" aria-label="Sluiten"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><span class="grow"></span><button class="btn btn-ghost btn-sm">Aankopen herstellen</button></div>
        <div class="content" style="gap: 22px; padding-top: 8px">
          <div class="hero">
            <div class="confetti" aria-hidden="true">
              <i style="left: 6%; background: #2E5BFF; animation-delay: 0s"></i><i style="left: 18%; background: #FFFFFF; animation-delay: .8s"></i><i style="left: 30%; background: #F0487A; animation-delay: 1.6s"></i><i style="left: 46%; background: #161F2A; animation-delay: .4s"></i><i style="left: 88%; background: #F0487A; animation-delay: 1.2s"></i>
            </div>
            <div class="stack g2 grow" style="position: relative">
              <span class="t-xs b" style="letter-spacing: 0.08em; text-transform: uppercase">Roosters+</span>
              <h1 class="title-xl" style="font-size: 44px; line-height: 46px">Premium</h1>
              <p class="t-sm b">Je wil Ilias erbij zetten. Gratis vergelijk je met 3 vrienden tegelijk.</p>
            </div>
            <svg class="mascot happy" width="104" height="111" viewBox="0 0 120 128" aria-hidden="true" style="position: relative; flex-shrink: 0"><g class="comb"><rect x="45" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect><rect x="55" y="4" width="11" height="28" rx="5.5" fill="#F0487A"></rect><rect x="66" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect></g><rect class="wing-l" x="11" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect class="wing-r" x="92" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect x="40" y="102" width="14" height="10" rx="5" fill="#161F2A"></rect><rect x="66" y="102" width="14" height="10" rx="5" fill="#161F2A"></rect><rect x="22" y="26" width="76" height="80" rx="32" fill="#2E5BFF"></rect><rect x="38" y="72" width="44" height="28" rx="14" fill="#5B7EFF"></rect><path d="M38 57q8-11 16 0M66 57q8-11 16 0" stroke="#161F2A" stroke-width="5" fill="none" stroke-linecap="round"></path><circle cx="34" cy="70" r="4.5" fill="#F0487A"></circle><circle cx="86" cy="70" r="4.5" fill="#F0487A"></circle><rect x="54" y="66" width="12" height="5" rx="2.5" fill="#FFC21A"></rect><rect x="57.5" y="62.5" width="5" height="12" rx="2.5" fill="#FFC21A"></rect><path d="M42 24 46 6 55 16 60 3 65 16 74 6 78 24Z" fill="#FFE08A" stroke="#161F2A" stroke-width="2.5" stroke-linejoin="round"></path></svg>
          </div>
          <div class="card" style="padding: 8px 16px; flex-shrink: 0">
            <div class="feat"><span class="fi" style="background: #F0487A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"></circle><path d="M3 19c.9-2.9 3.2-4.5 6-4.5s5.1 1.6 6 4.5"></path><path d="M15.5 5.7a3.5 3.5 0 0 1 0 6.6M17.5 14.8c1.6.6 2.8 2 3.5 4.2"></path></svg></span><span class="stack"><span class="b">Vergelijk met je hele groep</span><span class="t-sm m2">Meer dan 3 vrienden naast elkaar</span></span></div>
            <div class="feat"><span class="fi" style="background: #FFC21A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect></svg></span><span class="stack"><span class="b">Widgets</span><span class="t-sm m2">Beginscherm en vergrendelscherm</span></span></div>
            <div class="feat"><span class="fi" style="background: #2E5BFF; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"></circle><path d="M12 7.5V12l3 2"></path></svg></span><span class="stack"><span class="b">Live Activity</span><span class="t-sm m2">Hoe lang je les nog duurt</span></span></div>
            <div class="feat"><span class="fi" style="background: #0E9F8A; color: #FFFFFF"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span><span class="stack"><span class="b">Extra agenda's</span><span class="t-sm m2">Werk, sport, kot: één rooster</span></span></div>
            <div class="feat"><span class="fi" style="background: var(--gradient-premium)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17 6 7l4 4 2-6 2 6 4-4 2 10z"></path></svg></span><span class="stack"><span class="b">Thema's en app-iconen</span><span class="t-sm m2">Ook de mascotte met kroon</span></span></div>
            <div class="feat"><span class="fi" style="background: var(--color-surface-sunken); color: var(--color-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg></span><span class="stack"><span class="b">Slimme meldingen en stats</span><span class="t-sm m2">Je semester in pauzes</span></span></div>
          </div>
          <div class="stack g2" role="radiogroup" aria-label="Kies een abonnement">
            <button class="plan on" role="radio" aria-checked="true">
              <span class="radio on" style="margin-top: 2px"></span>
              <span class="stack g1 grow"><span class="hstack between"><span class="b t-lg">Jaarlijks</span><span class="tag tag-gold">Bespaar 44%</span></span><span class="t-base">€19,99 per jaar</span><span class="t-sm m2">€1,67 per maand</span></span>
            </button>
            <button class="plan" role="radio" aria-checked="false">
              <span class="radio" style="margin-top: 2px"></span>
              <span class="stack g1 grow"><span class="b t-lg">Maandelijks</span><span class="t-base">€2,99 per maand</span></span>
            </button>
          </div>
          <button class="btn btn-gold" style="min-height: 56px; font-size: 18px">Neem Premium · €19,99 per jaar</button>
          <p class="t-xs m2" style="text-align: center">Verlengt automatisch elk jaar tot je opzegt. Opzeggen kan altijd in je App Store-instellingen, ten laatste 24 uur voor de verlenging.</p>
          <p class="t-sm" style="text-align: center"><a class="link" href="#">Voorwaarden</a> · <a class="link" href="#">Privacy</a> · <a class="link" href="#">Aankopen herstellen</a></p>
          <p class="t-sm m2" style="text-align: center">Altijd gratis: rooster, vrienden, vergelijken met 3, samen pauze, chat.</p>
        </div>
      </div>
    </figure>

    <!-- P2 Trial end -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>B</b> Einde proefperiode · twee even duidelijke keuzes</figcaption>
      <div class="phone">
        <div class="safe"></div>
        <div class="content" style="gap: 20px; padding-top: 20px">
          <div class="hstack g4">
            <svg class="mascot" width="72" height="77" viewBox="0 0 120 128" aria-hidden="true"><g class="comb"><rect x="45" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect><rect x="55" y="4" width="11" height="28" rx="5.5" fill="#F0487A"></rect><rect x="66" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect></g><rect class="wing-l" x="11" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect class="wing-r" x="92" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect x="40" y="102" width="14" height="10" rx="5" fill="#FFC21A"></rect><rect x="66" y="102" width="14" height="10" rx="5" fill="#FFC21A"></rect><rect x="22" y="26" width="76" height="80" rx="32" fill="#2E5BFF"></rect><rect x="38" y="72" width="44" height="28" rx="14" fill="#5B7EFF"></rect><g class="eye"><circle cx="46" cy="54" r="9" fill="#FFFFFF"></circle><circle cx="48" cy="56" r="5" fill="#161F2A"></circle><circle cx="50" cy="53.6" r="1.7" fill="#FFFFFF"></circle></g><g class="eye"><circle cx="74" cy="54" r="9" fill="#FFFFFF"></circle><circle cx="72" cy="56" r="5" fill="#161F2A"></circle><circle cx="74" cy="53.6" r="1.7" fill="#FFFFFF"></circle></g><circle cx="34" cy="70" r="4.5" fill="#F0487A"></circle><circle cx="86" cy="70" r="4.5" fill="#F0487A"></circle><rect x="54" y="66" width="12" height="5" rx="2.5" fill="#FFC21A"></rect><rect x="57.5" y="62.5" width="5" height="12" rx="2.5" fill="#FFC21A"></rect></svg>
            <h1 class="title grow">Je proefperiode is voorbij</h1>
          </div>
          <div class="card" style="padding: 8px 16px; flex-shrink: 0">
            <p class="list-head" style="padding: 10px 0 2px">Dit verdwijnt</p>
            <div class="loss"><span class="fi" style="background: #FFC21A; width: 32px; height: 32px; border-radius: 9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="16" height="7" rx="1.5"></rect></svg></span><span class="t-base">Je 2 widgets worden leeg</span></div>
            <div class="loss"><span class="fi" style="background: #F0487A; width: 32px; height: 32px; border-radius: 9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="3.5"></circle><path d="M3 19c.9-2.9 3.2-4.5 6-4.5s5.1 1.6 6 4.5"></path></svg></span><span class="t-base">Weer max 3 vrienden vergelijken. Je groep blijft bewaard.</span></div>
            <div class="loss"><span class="fi" style="background: #0E9F8A; color: #FFFFFF; width: 32px; height: 32px; border-radius: 9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"></path></svg></span><span class="t-base">Agenda "Werk" pauzeert</span></div>
            <div class="loss"><span class="fi" style="background: var(--gradient-premium); width: 32px; height: 32px; border-radius: 9px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 17 6 7l4 4 2-6 2 6 4-4 2 10z"></path></svg></span><span class="t-base">Thema en icoon worden standaard</span></div>
          </div>
          <div class="hstack g3" style="padding: 12px 16px; border-radius: 12px; background: var(--color-success-soft)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="ok-ink"><path d="m5 12.5 4.5 4.5L19 7.5"></path></svg><span class="t-sm"><b>Blijft gratis:</b> rooster, vrienden, samen pauze en chat.</span></div>
        </div>
        <div style="padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 10px">
          <button class="btn btn-gold">Premium houden · €19,99 per jaar</button>
          <button class="btn btn-primary">Gratis verdergaan</button>
        </div>
      </div>
    </figure>

    <!-- P3 Success -->
    <figure class="shot">
      <figcaption class="shot-cap"><b>C</b> Succes: Premium actief</figcaption>
      <div class="phone">
        <div class="confetti" aria-hidden="true" style="height: 520px">
          <i style="left: 8%; background: #2E5BFF; animation-delay: 0s"></i><i style="left: 17%; background: #FFC21A; animation-delay: .5s"></i><i style="left: 28%; background: #F0487A; animation-delay: 1.1s"></i><i style="left: 40%; background: #D9A520; animation-delay: 1.7s"></i><i style="left: 58%; background: #2E5BFF; animation-delay: .3s"></i><i style="left: 70%; background: #F0487A; animation-delay: 1.4s"></i><i style="left: 82%; background: #FFC21A; animation-delay: .8s"></i><i style="left: 92%; background: #0E9F8A; animation-delay: 2s"></i>
        </div>
        <div class="safe"></div>
        <div class="content" style="justify-content: center; align-items: center; text-align: center; gap: 18px">
          <div style="width: 220px; height: 220px; border-radius: 110px; background: var(--gradient-premium); display: flex; align-items: center; justify-content: center">
            <svg class="mascot happy" width="150" height="160" viewBox="0 0 120 128" aria-hidden="true"><g class="comb"><rect x="45" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect><rect x="55" y="4" width="11" height="28" rx="5.5" fill="#F0487A"></rect><rect x="66" y="11" width="10" height="21" rx="5" fill="#F0487A"></rect></g><rect class="wing-l" x="11" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect class="wing-r" x="92" y="62" width="17" height="28" rx="8.5" fill="#1D3FD0"></rect><rect x="40" y="102" width="14" height="10" rx="5" fill="#161F2A"></rect><rect x="66" y="102" width="14" height="10" rx="5" fill="#161F2A"></rect><rect x="22" y="26" width="76" height="80" rx="32" fill="#2E5BFF"></rect><rect x="38" y="72" width="44" height="28" rx="14" fill="#5B7EFF"></rect><path d="M38 57q8-11 16 0M66 57q8-11 16 0" stroke="#161F2A" stroke-width="5" fill="none" stroke-linecap="round"></path><circle cx="34" cy="70" r="4.5" fill="#F0487A"></circle><circle cx="86" cy="70" r="4.5" fill="#F0487A"></circle><rect x="54" y="66" width="12" height="5" rx="2.5" fill="#FFC21A"></rect><rect x="57.5" y="62.5" width="5" height="12" rx="2.5" fill="#FFC21A"></rect><path d="M42 24 46 6 55 16 60 3 65 16 74 6 78 24Z" fill="#FFE08A" stroke="#161F2A" stroke-width="2.5" stroke-linejoin="round"></path></svg>
          </div>
          <h1 class="title-xl">Welkom bij <span class="gold-ink">Premium</span></h1>
          <div class="bubble">Ilias staat nu naast je in Vergelijken. Zet je widget op je beginscherm!</div>
        </div>
        <div style="padding: 12px 20px 34px; display: flex; flex-direction: column; gap: 8px">
          <button class="btn btn-gold">Toon hoe ik een widget zet</button>
          <button class="btn btn-ghost">Terug naar vergelijken</button>
        </div>
      </div>
    </figure>

  </div>
</section>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1403,"height":3000}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [
      { id: 'l', cls: 'theme-light', label: 'Licht' },
      { id: 'd', cls: 'theme-dark', label: 'Donker' }
    ] };
  }
}
</script>
</body>
</html>
